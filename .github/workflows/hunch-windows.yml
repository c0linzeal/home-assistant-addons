name: Build Hunch for Windows

on:
  push:
    paths:
      - "hunch/**"
      - ".github/workflows/hunch-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hunch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hunch/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Hunch-Windows-installer
          path: hunch/dist/*.exe
          if-no-files-found: error
